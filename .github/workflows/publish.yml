name: Instagram投稿

on:
  schedule:
    # 12:00 UTC = 21:00 JST（PCが開いていなくても動く）
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "公開せずコンテナ作成まで試す"
        type: boolean
        default: false
      date:
        description: "動作確認用：この日付の予定で試す（例 2026-11-23）"
        type: string
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 投稿する
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date=${{ inputs.date }}"; fi
          python publish/publish.py $ARGS
